<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1100" viewBox="0 0 1500 1100" role="img" font-family="DejaVu Sans, sans-serif">
<title>Two-stage method — ECW dispatches the active session</title>
<desc>Stage 1 builds, reserves a booking, registers an activation trigger and ends. ECW waits for booking activation, then dispatches Stage 2. Stage 2 claims the run, configures HIL, uploads and explicitly flashes MCU firmware, runs jobs, saves artifacts and releases the booking. Duplicate dispatches that lose the claim do no hardware work and do not release the booking.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#3accba"/></marker></defs>
<rect width="1500" height="1100" fill="#101010"/>
<text x="48" y="52" fill="#f1f5f3" font-size="29" font-weight="700">Two-stage method — ECW dispatches the active session</text>
<text x="48" y="88" fill="#adc1ba" font-size="18">Workflow version: delelop_2_stages. No GitHub runner waits between Stage 1 and Stage 2.</text>
<rect x="36" y="125" width="1428" height="180" rx="12" fill="#202020" stroke="#40554d" stroke-width="1.5"/>
<text x="60" y="154" fill="#3accba" font-size="17" font-weight="700" text-anchor="start">STAGE 1  /  ci-job-trigger-stage1.yml</text>
<rect x="60" y="175" width="300" height="110" rx="12" fill="#173c34" stroke="#3accba" stroke-width="1.5"/>
<text x="78" y="203" fill="#3accba" font-size="16" font-weight="700" text-anchor="start">1</text>
<text x="210.0" y="210" fill="#f1f5f3" font-size="21" font-weight="700" text-anchor="middle">Build</text>
<text x="210.0" y="240" fill="#adc1ba" font-size="15" font-weight="400" text-anchor="middle">Build MCU firmware</text>
<text x="210.0" y="263" fill="#adc1ba" font-size="15" font-weight="400" text-anchor="middle">Save artifact + commit SHA</text>
<path d="M360 230H412" fill="none" stroke="#3accba" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="420" y="175" width="300" height="110" rx="12" fill="#173c34" stroke="#3accba" stroke-width="1.5"/>
<text x="438" y="203" fill="#3accba" font-size="16" font-weight="700" text-anchor="start">2</text>
<text x="570.0" y="210" fill="#f1f5f3" font-size="21" font-weight="700" text-anchor="middle">Reserve</text>
<text x="570.0" y="240" fill="#adc1ba" font-size="15" font-weight="400" text-anchor="middle">Reuse or create</text>
<text x="570.0" y="263" fill="#adc1ba" font-size="15" font-weight="400" text-anchor="middle">an owned booking</text>
<path d="M720 230H772" fill="none" stroke="#3accba" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="780" y="175" width="300" height="110" rx="12" fill="#173c34" stroke="#3accba" stroke-width="1.5"/>
<text x="798" y="203" fill="#3accba" font-size="16" font-weight="700" text-anchor="start">3</text>
<text x="930.0" y="210" fill="#f1f5f3" font-size="21" font-weight="700" text-anchor="middle">Register trigger</text>
<text x="930.0" y="240" fill="#adc1ba" font-size="15" font-weight="400" text-anchor="middle">Register Stage 2 workflow/ref</text>
<text x="930.0" y="263" fill="#adc1ba" font-size="15" font-weight="400" text-anchor="middle">Associate the built artifact</text>
<path d="M1080 230H1132" fill="none" stroke="#3accba" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="1140" y="175" width="300" height="110" rx="12" fill="#173c34" stroke="#3accba" stroke-width="1.5"/>
<text x="1158" y="203" fill="#3accba" font-size="16" font-weight="700" text-anchor="start">4</text>
<text x="1290.0" y="210" fill="#f1f5f3" font-size="21" font-weight="700" text-anchor="middle">Run ends</text>
<text x="1290.0" y="240" fill="#adc1ba" font-size="15" font-weight="400" text-anchor="middle">Stage 1 runner stops</text>
<text x="1290.0" y="263" fill="#adc1ba" font-size="15" font-weight="400" text-anchor="middle">The booking remains held</text>
<rect x="360" y="345" width="780" height="145" rx="12" fill="#162c43" stroke="#6d9dc4" stroke-width="1.5"/>
<text x="750" y="380" fill="#a9caed" font-size="21" font-weight="700" text-anchor="middle">ECW BACKEND</text>
<text x="750" y="414" fill="#adc1ba" font-size="17" font-weight="400" text-anchor="middle">Wait for the booking to become active — no GitHub runner is held.</text>
<text x="750" y="452" fill="#adc1ba" font-size="16" font-weight="400" text-anchor="middle">workflow_dispatch → Stage 2, with booking context and a claim nonce</text>
<path d="M930 285V337" fill="none" stroke="#3accba" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M750 490V542" fill="none" stroke="#3accba" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="36" y="550" width="1428" height="220" rx="12" fill="#202020" stroke="#40554d" stroke-width="1.5"/>
<text x="60" y="582" fill="#3accba" font-size="17" font-weight="700" text-anchor="start">STAGE 2  /  ci-job-trigger-stage2.yml</text>
<rect x="60" y="615" width="240" height="110" rx="12" fill="#173c34" stroke="#3accba" stroke-width="1.5"/>
<text x="78" y="643" fill="#3accba" font-size="16" font-weight="700" text-anchor="start">1</text>
<text x="180.0" y="650" fill="#f1f5f3" font-size="21" font-weight="700" text-anchor="middle">Claim</text>
<text x="180.0" y="680" fill="#adc1ba" font-size="15" font-weight="400" text-anchor="middle">Claim this trigger once</text>
<text x="180.0" y="703" fill="#adc1ba" font-size="15" font-weight="400" text-anchor="middle">Only one run proceeds</text>
<path d="M300 670H336" fill="none" stroke="#3accba" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="344" y="615" width="240" height="110" rx="12" fill="#173c34" stroke="#3accba" stroke-width="1.5"/>
<text x="362" y="643" fill="#3accba" font-size="16" font-weight="700" text-anchor="start">2</text>
<text x="464.0" y="650" fill="#f1f5f3" font-size="21" font-weight="700" text-anchor="middle">Configure HIL</text>
<text x="464.0" y="680" fill="#adc1ba" font-size="15" font-weight="400" text-anchor="middle">Prepare → active → CSV</text>
<text x="464.0" y="703" fill="#adc1ba" font-size="15" font-weight="400" text-anchor="middle">Max 180 s for preparation</text>
<path d="M584 670H620" fill="none" stroke="#3accba" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="628" y="615" width="240" height="110" rx="12" fill="#173c34" stroke="#3accba" stroke-width="1.5"/>
<text x="646" y="643" fill="#3accba" font-size="16" font-weight="700" text-anchor="start">3</text>
<text x="748.0" y="650" fill="#f1f5f3" font-size="21" font-weight="700" text-anchor="middle">Upload</text>
<text x="748.0" y="680" fill="#adc1ba" font-size="15" font-weight="400" text-anchor="middle">Stage 1 artifact + SHA</text>
<text x="748.0" y="703" fill="#adc1ba" font-size="15" font-weight="400" text-anchor="middle">Store → explicit flash</text>
<path d="M868 670H904" fill="none" stroke="#3accba" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="912" y="615" width="240" height="110" rx="12" fill="#173c34" stroke="#3accba" stroke-width="1.5"/>
<text x="930" y="643" fill="#3accba" font-size="16" font-weight="700" text-anchor="start">4</text>
<text x="1032.0" y="650" fill="#f1f5f3" font-size="21" font-weight="700" text-anchor="middle">Test</text>
<text x="1032.0" y="680" fill="#adc1ba" font-size="15" font-weight="400" text-anchor="middle">Run user-defined jobs</text>
<text x="1032.0" y="703" fill="#adc1ba" font-size="15" font-weight="400" text-anchor="middle">Save results and artifacts</text>
<path d="M1152 670H1188" fill="none" stroke="#3accba" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="1196" y="615" width="240" height="110" rx="12" fill="#173c34" stroke="#3accba" stroke-width="1.5"/>
<text x="1214" y="643" fill="#3accba" font-size="16" font-weight="700" text-anchor="start">5</text>
<text x="1316.0" y="650" fill="#f1f5f3" font-size="21" font-weight="700" text-anchor="middle">Release</text>
<text x="1316.0" y="680" fill="#adc1ba" font-size="15" font-weight="400" text-anchor="middle">Cancel the booking</text>
<text x="1316.0" y="703" fill="#adc1ba" font-size="15" font-weight="400" text-anchor="middle">Cleanup for the claim winner</text>
<text x="60" y="751" fill="#e6c279" font-size="16" font-weight="400" text-anchor="start">A duplicate dispatch that loses the claim skips HIL, Upload, Test and Release.</text>
<rect x="60" y="802" width="670" height="205" rx="12" fill="#202020" stroke="#3accba" stroke-width="1.5"/>
<text x="82" y="834" fill="#3accba" font-size="20" font-weight="700" text-anchor="start">CONFIGURE HIL</text>
<text x="82" y="867" fill="#adc1ba" font-size="16" font-weight="400" text-anchor="start">Read HIL_SENSOR_NAME and the frontend-format CSV.</text>
<text x="82" y="894" fill="#adc1ba" font-size="16" font-weight="400" text-anchor="start">Select one sensor; prepare and activate the approved image.</text>
<text x="82" y="921" fill="#adc1ba" font-size="16" font-weight="400" text-anchor="start">Wait for preparation success: maximum 180 seconds.</text>
<text x="82" y="948" fill="#adc1ba" font-size="16" font-weight="400" text-anchor="start">Send physical CSV values in batches with verified readback.</text>
<text x="82" y="975" fill="#adc1ba" font-size="16" font-weight="400" text-anchor="start">Blank HIL_SENSOR_NAME skips this setup.</text>
<rect x="770" y="802" width="670" height="205" rx="12" fill="#202020" stroke="#6d9dc4" stroke-width="1.5"/>
<text x="792" y="834" fill="#a9caed" font-size="19" font-weight="700" text-anchor="start">UPLOAD — TWO EXPLICIT API OPERATIONS</text>
<text x="792" y="867" fill="#adc1ba" font-size="16" font-weight="400" text-anchor="start">1. POST /upload → store the MCU firmware only.</text>
<text x="792" y="894" fill="#adc1ba" font-size="16" font-weight="400" text-anchor="start">2. Check the stored filename, then request its flash:</text>
<text x="792" y="921" fill="#adc1ba" font-size="16" font-weight="400" text-anchor="start">   POST /v1/artifacts/my-uploads?code=…</text>
<text x="792" y="948" fill="#adc1ba" font-size="16" font-weight="400" text-anchor="start">Require success before starting CI jobs.</text>
<text x="792" y="975" fill="#adc1ba" font-size="16" font-weight="400" text-anchor="start">Upload success alone does not mean flash success.</text>
<text x="60" y="1044" fill="#adc1ba" font-size="15" font-weight="400" text-anchor="start">On HIL/upload/test failure, the claim winner retains Release cleanup. A claim loser never releases the booking.</text>
<text x="60" y="1073" fill="#adc1ba" font-size="15" font-weight="400" text-anchor="start">Install both workflow files on the consuming repository’s default branch. Stage 2 uses Stage 1’s built commit and artifact.</text>
</svg>
