<svg viewBox="0 0 1040 460" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Data flow of the bundled Arduino demo: the sketch is compiled to a .bin by build.sh, stored and explicitly flashed by Upload after Configure HIL, then the serial and camera CI jobs capture its output as artifacts.">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <polygon points="0,0 8,4.5 0,9" fill="#3accba"></polygon>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="460" fill="#101010"></rect>

  <text x="25" y="36" font-family="ui-sans-serif, Segoe UI, Arial" font-size="20" font-weight="700" fill="#ffffff">Arduino demo: from sketch to captured artifacts</text>
  <text x="25" y="58" font-family="ui-sans-serif, Segoe UI, Arial" font-size="13" fill="#8fa6a1">What actually happens to arduino_ci_demo.ino across one pipeline run</text>

  <g font-family="ui-sans-serif, Segoe UI, Arial">
    <!-- Sketch -->
    <rect x="25" y="100" width="200" height="70" rx="10" fill="#19202b" stroke="#3accba" stroke-width="1.4"></rect>
    <text x="125" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">arduino_ci_demo.ino</text>
    <text x="125" y="152" text-anchor="middle" font-size="11" fill="#8fa6a1">src/arduino_ci_demo/</text>

    <!-- build.sh -->
    <rect x="285" y="100" width="200" height="70" rx="10" fill="#17685f" stroke="#3accba" stroke-width="1.4"></rect>
    <text x="385" y="127" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">build.sh</text>
    <text x="385" y="146" text-anchor="middle" font-size="11" fill="#cfe9e4">arduino-cli compile</text>
    <text x="385" y="161" text-anchor="middle" font-size="11" fill="#cfe9e4">Build job, ubuntu-latest</text>

    <!-- .bin -->
    <rect x="545" y="100" width="160" height="70" rx="10" fill="#19202b" stroke="#3accba" stroke-width="1.4"></rect>
    <text x="625" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">*.bin</text>
    <text x="625" y="152" text-anchor="middle" font-size="11" fill="#8fa6a1">build/ artifact</text>

    <!-- Upload includes storage and explicit flashing -->
    <rect x="765" y="100" width="200" height="70" rx="10" fill="#17685f" stroke="#3accba" stroke-width="1.4"></rect>
    <text x="865" y="127" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Upload job</text>
    <text x="865" y="146" text-anchor="middle" font-size="11" fill="#cfe9e4">POST /upload</text>
    <text x="865" y="161" text-anchor="middle" font-size="11" fill="#cfe9e4">stores then explicitly flashes</text>

    <!-- Board running -->
    <rect x="365" y="240" width="310" height="70" rx="10" fill="#1c3a6c" stroke="#3accba" stroke-width="1.4"></rect>
    <text x="520" y="267" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Board running the sketch</text>
    <text x="520" y="286" text-anchor="middle" font-size="11" fill="#cfe9e4">LED matrix shows "D" -- serial prints "Your value is D"</text>
    <text x="520" y="301" text-anchor="middle" font-size="11" fill="#cfe9e4">once per second</text>

    <!-- Test job jobs -->
    <rect x="60" y="370" width="270" height="70" rx="10" fill="#17685f" stroke="#3accba" stroke-width="1.4"></rect>
    <text x="195" y="397" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">02_serial.json</text>
    <text x="195" y="416" text-anchor="middle" font-size="11" fill="#cfe9e4">mcu.serial_log -&gt; gha-mcu.log</text>
    <text x="195" y="431" text-anchor="middle" font-size="10.5" fill="#9fb0ad">"Your value is D"</text>

    <rect x="710" y="370" width="270" height="70" rx="10" fill="#17685f" stroke="#3accba" stroke-width="1.4"></rect>
    <text x="845" y="397" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">03_camera.json</text>
    <text x="845" y="416" text-anchor="middle" font-size="11" fill="#cfe9e4">camera.screenshot -&gt; gha-frame.jpg</text>
    <text x="845" y="431" text-anchor="middle" font-size="10.5" fill="#9fb0ad">board + lit matrix, in frame</text>
  </g>

  <!-- top row arrows -->
  <g stroke="#3accba" stroke-width="2">
    <line x1="225" y1="135" x2="281" y2="135" marker-end="url(#arrow)"></line>
    <line x1="485" y1="135" x2="541" y2="135" marker-end="url(#arrow)"></line>
    <line x1="705" y1="135" x2="761" y2="135" marker-end="url(#arrow)"></line>
  </g>

  <!-- Configure HIL finishes before Upload starts; Upload then programs the MCU -->
  <path d="M 865 170 L 865 240 L 679 240" fill="none" stroke="#3accba" stroke-width="2" marker-end="url(#arrow)"></path>

  <!-- board down to the two jobs -->
  <path d="M 450 310 L 450 340 L 195 340 L 195 366" fill="none" stroke="#3accba" stroke-width="2" marker-end="url(#arrow)"></path>
  <path d="M 590 310 L 590 340 L 845 340 L 845 366" fill="none" stroke="#3accba" stroke-width="2" marker-end="url(#arrow)"></path>

  <text x="25" y="450" font-family="ui-sans-serif, Segoe UI, Arial" font-size="11" fill="#8fa6a1">Full walkthrough: docs/08-arduino-demo.md</text>
</svg>
