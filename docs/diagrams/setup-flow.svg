<svg viewBox="0 0 1040 320" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Setup flow: GitHub account with repo access, and an ECW account with booking permission, both feed into creating an API key from the ECW frontend, which is set as a repository secret, then the repository variables are set, then Run workflow or a pull request starts the pipeline.">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <polygon points="0,0 8,4.5 0,9" fill="#3accba"></polygon>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="320" fill="#101010"></rect>

  <text x="25" y="36" font-family="ui-sans-serif, Segoe UI, Arial" font-size="20" font-weight="700" fill="#ffffff">Setup, start to finish</text>
  <text x="25" y="58" font-family="ui-sans-serif, Segoe UI, Arial" font-size="13" fill="#8fa6a1">What has to exist before the pipeline can run green -- docs/01-getting-started.md</text>

  <g font-family="ui-sans-serif, Segoe UI, Arial">
    <!-- GitHub account -->
    <rect x="25" y="90" width="220" height="66" rx="10" fill="#19202b" stroke="#3accba" stroke-width="1.4"></rect>
    <text x="135" y="118" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">GitHub account</text>
    <text x="135" y="136" text-anchor="middle" font-size="10.5" fill="#8fa6a1">write/admin on this repo</text>

    <!-- ECW account -->
    <rect x="25" y="180" width="220" height="66" rx="10" fill="#19202b" stroke="#3accba" stroke-width="1.4"></rect>
    <text x="135" y="208" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">ECW account</text>
    <text x="135" y="226" text-anchor="middle" font-size="10.5" fill="#8fa6a1">booking permission on the board</text>

    <!-- API key -->
    <rect x="305" y="135" width="220" height="66" rx="10" fill="#17685f" stroke="#3accba" stroke-width="1.4"></rect>
    <text x="415" y="163" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">API key</text>
    <text x="415" y="181" text-anchor="middle" font-size="10.5" fill="#cfe9e4">Profile &gt; Developer Settings</text>

    <!-- Secrets+vars -->
    <rect x="585" y="135" width="230" height="66" rx="10" fill="#17685f" stroke="#3accba" stroke-width="1.4"></rect>
    <text x="700" y="163" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Repo secrets &amp; variables</text>
    <text x="700" y="181" text-anchor="middle" font-size="10.5" fill="#cfe9e4">ECW_API_KEY, BOARD_NAME</text>

    <!-- Start the workflow -->
    <rect x="875" y="135" width="140" height="66" rx="10" fill="#1c3a6c" stroke="#3accba" stroke-width="1.4"></rect>
    <text x="945" y="163" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Run workflow / PR</text>
    <text x="945" y="181" text-anchor="middle" font-size="10.5" fill="#cfe9e4">pipeline runs</text>
  </g>

  <g stroke="#3accba" stroke-width="2" fill="none">
    <path d="M 245 123 L 275 123 L 275 168 L 301 168" marker-end="url(#arrow)"></path>
    <path d="M 245 213 L 275 213 L 275 168" ></path>
    <line x1="525" y1="168" x2="581" y2="168" marker-end="url(#arrow)"></line>
    <line x1="815" y1="168" x2="871" y2="168" marker-end="url(#arrow)"></line>
  </g>

  <text x="25" y="280" font-family="ui-sans-serif, Segoe UI, Arial" font-size="11" fill="#8fa6a1">Both accounts are prerequisites -- see docs/01-getting-started.md #0 -- the rest is done once, per repository.</text>
</svg>
