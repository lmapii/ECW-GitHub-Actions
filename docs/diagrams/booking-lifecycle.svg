<svg viewBox="0 0 1110 345" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="find_or_create_booking.py checks for an existing matching booking; if found it's reused as-is, otherwise a new one is auto-booked. Either way the booking moves from reserved, to active once the Wait job polls it into session, to released once Configure HIL, Upload and Test finish and Release cancels it.">
  <defs>
    <marker id="barrow" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <polygon points="0,0 8,4.5 0,9" fill="#3accba"></polygon>
    </marker>
    <marker id="barrowYellow" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <polygon points="0,0 8,4.5 0,9" fill="#f1e500"></polygon>
    </marker>
  </defs>

  <rect x="0" y="0" width="1110" height="345" fill="#101010"></rect>
  <text x="20" y="34" font-family="ui-sans-serif, Segoe UI, Arial" font-size="16" font-weight="700" fill="#ffffff">Booking lifecycle</text>

  <g font-family="ui-sans-serif, Segoe UI, Arial">
    <!-- entry -->
    <rect x="20" y="140" width="150" height="60" rx="10" fill="#19202b" stroke="#76787a" stroke-width="1.2"></rect>
    <text x="95" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Reserve job</text>
    <text x="95" y="184" text-anchor="middle" font-size="10.5" fill="#8fa6a1">find_or_create_booking.py</text>

    <!-- decision diamond, centered x=260 y=170 -->
    <polygon points="260,110 330,170 260,230 190,170" fill="#19202b" stroke="#f1e500" stroke-width="1.4"></polygon>
    <text x="260" y="166" text-anchor="middle" font-size="10.5" font-weight="700" fill="#f1e500">existing</text>
    <text x="260" y="180" text-anchor="middle" font-size="10.5" font-weight="700" fill="#f1e500">match?</text>

    <!-- reuse branch, vertically aligned under the diamond -->
    <rect x="180" y="250" width="160" height="60" rx="10" fill="#19202b" stroke="#76787a" stroke-width="1.2"></rect>
    <text x="260" y="276" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Reuse booking</text>
    <text x="260" y="294" text-anchor="middle" font-size="10.5" fill="#8fa6a1">GET /bookings/me</text>

    <!-- auto-book branch, right of the diamond -->
    <rect x="370" y="140" width="150" height="60" rx="10" fill="#19202b" stroke="#76787a" stroke-width="1.2"></rect>
    <text x="445" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Auto-book</text>
    <text x="445" y="184" text-anchor="middle" font-size="10.5" fill="#8fa6a1">POST /auto-bookings</text>

    <!-- state: reserved -->
    <rect x="560" y="140" width="150" height="60" rx="10" fill="#17685f" stroke="#3accba" stroke-width="1.4"></rect>
    <text x="635" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">reserved</text>
    <text x="635" y="184" text-anchor="middle" font-size="10.5" fill="#cfeeea">booking status</text>

    <!-- state: active -->
    <rect x="750" y="140" width="150" height="60" rx="10" fill="#17685f" stroke="#3accba" stroke-width="1.4"></rect>
    <text x="825" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">active</text>
    <text x="825" y="184" text-anchor="middle" font-size="10.5" fill="#cfeeea">HIL + Upload + Test run</text>

    <!-- state: released -->
    <rect x="940" y="140" width="150" height="60" rx="10" fill="#17685f" stroke="#3accba" stroke-width="1.4"></rect>
    <text x="1015" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">released</text>
    <text x="1015" y="184" text-anchor="middle" font-size="10.5" fill="#cfeeea">GET /cancel-booking</text>
  </g>

  <!-- arrows -->
  <g stroke="#3accba" stroke-width="1.8" fill="none">
    <line x1="170" y1="170" x2="186" y2="170" marker-end="url(#barrow)"></line>
    <line x1="520" y1="170" x2="556" y2="170" marker-end="url(#barrow)"></line>
    <line x1="710" y1="170" x2="746" y2="170" marker-end="url(#barrow)"></line>
    <line x1="900" y1="170" x2="936" y2="170" marker-end="url(#barrow)"></line>
  </g>
  <g stroke="#f1e500" stroke-width="1.8" fill="none">
    <line x1="260" y1="230" x2="260" y2="246" marker-end="url(#barrowYellow)"></line>
    <line x1="330" y1="170" x2="366" y2="170" marker-end="url(#barrowYellow)"></line>
  </g>
  <path d="M 340 280 L 635 280 L 635 204" fill="none" stroke="#3accba" stroke-width="1.8" marker-end="url(#barrow)"></path>

  <text x="272" y="242" font-family="ui-sans-serif, Segoe UI, Arial" font-size="10.5" font-weight="700" fill="#f1e500">yes</text>
  <text x="348" y="160" font-family="ui-sans-serif, Segoe UI, Arial" font-size="10.5" font-weight="700" fill="#f1e500">no</text>
  <text x="537" y="270" text-anchor="middle" font-family="ui-sans-serif, Segoe UI, Arial" font-size="10.5" fill="#8fa6a1">reused as-is</text>
  <text x="733" y="160" text-anchor="middle" font-family="ui-sans-serif, Segoe UI, Arial" font-size="10.5" fill="#8fa6a1">Wait polls</text>
  <text x="918" y="160" text-anchor="middle" font-family="ui-sans-serif, Segoe UI, Arial" font-size="10.5" fill="#8fa6a1">Release</text>
</svg>
