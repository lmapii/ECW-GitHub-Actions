name: CI client tests

on:
  push:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/ci-client-tests.yml'
      - 'tests/**'
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/ci-client-tests.yml'
      - 'tests/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test upload, explicit flash and booking readiness without hardware
        run: python -m unittest discover -s tests -v
